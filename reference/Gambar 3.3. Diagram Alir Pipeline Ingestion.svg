<svg viewBox="0 0 880 1050" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="background-color: #ffffff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.07" flood-color="#0f172a" />
        </filter>

        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
        </marker>
        
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
        </marker>

        <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706" />
        </marker>
    </defs>

    <!-- <rect width="100%" height="100%" fill="#ffffff"/> -->


    <g id="input-corpus" filter="url(#shadow)">
        <rect x="250" y="100" width="380" height="65" rx="10" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/>
        <text x="440" y="128" text-anchor="middle" font-weight="800" fill="#6b21a8" font-size="14">Dokumen Mentah Korpus</text>
        <text x="440" y="148" text-anchor="middle" font-weight="600" fill="#7e22ce" font-size="12">Format: .md + YAML Frontmatter</text>
    </g>

    <path d="M 440 165 L 440 200" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <g id="parse-yaml" filter="url(#shadow)">
        <rect x="250" y="200" width="380" height="55" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
        <text x="440" y="225" text-anchor="middle" font-weight="700" fill="#334155" font-size="13">Parse YAML Frontmatter</text>
        <text x="440" y="242" text-anchor="middle" font-weight="500" fill="#64748b" font-size="11">Ekstraksi Metadata (doc_id, title, category)</text>
    </g>

    <path d="M 440 255 L 440 290" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="210" y="290" width="460" height="195" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="375" y="312" font-weight="800" fill="#1d4ed8" font-size="11" letter-spacing="0.5">STRATEGI CHUNKING</text>

    <g id="stage1-split" filter="url(#shadow)">
        <rect x="230" y="325" width="420" height="60" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
        <text x="440" y="348" text-anchor="middle" font-weight="700" fill="#1e3a8a" font-size="13">Tahap 1: Structural Split (MarkdownHeaderTextSplitter)</text>
        <text x="440" y="368" text-anchor="middle" font-weight="500" fill="#2563eb" font-size="11">Memotong berdasarkan batas hierarki heading (#, ##, ###, ####)</text>
    </g>

    <path d="M 440 385 L 440 410" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

    <g id="stage2-split" filter="url(#shadow)">
        <rect x="230" y="410" width="420" height="60" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
        <text x="440" y="433" text-anchor="middle" font-weight="700" fill="#1e3a8a" stroke-width="0" font-size="13">Tahap 2: Size Normalization (RecursiveCharacterTextSplitter)</text>
        <text x="440" y="453" text-anchor="middle" font-weight="600" fill="#2563eb" font-size="11">Parameter: chunk_size = 2000 | chunk_overlap = 200</text>
    </g>

    <path d="M 440 485 L 440 520" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <g id="filter-chunks" filter="url(#shadow)">
        <rect x="250" y="520" width="380" height="50" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
        <text x="440" y="542" text-anchor="middle" font-weight="700" fill="#14532d" font-size="13">Pembersihan Potongan Teks (Filter Chunk)</text>
        <text x="440" y="558" text-anchor="middle" font-weight="500" fill="#16a34a" font-size="11">Mengabaikan chunk too short (&lt;50 karakter)</text>
    </g>

    <path d="M 440 570 L 440 605" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <g id="deduplication" filter="url(#shadow)">
        <rect x="250" y="605" width="380" height="50" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
        <text x="440" y="627" text-anchor="middle" font-weight="700" fill="#14532d" font-size="13">Deduplikasi Data (Hash MD5)</text>
        <text x="440" y="643" text-anchor="middle" font-weight="500" fill="#16a34a" font-size="11">Menghindari redundansi data teks sebelum pengindeksan</text>
    </g>

    <path d="M 440 655 L 440 690" stroke="#64748b" stroke-width="2"/>
    
    <path d="M 440 690 L 220 690 L 220 720" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 440 690 L 660 690 L 660 720" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <g id="config-b-embed" filter="url(#shadow)">
        <rect x="50" y="720" width="340" height="70" rx="8" fill="#f0f5ff" stroke="#adc8ff" stroke-width="1.5"/>
        <text x="220" y="745" text-anchor="middle" font-weight="800" fill="#1d4ed8" font-size="13">Dense RAG (Config B)</text>
        <text x="220" y="763" text-anchor="middle" font-weight="700" fill="#002c91" font-size="12">Proses Embedding Teks</text>
        <text x="220" y="778" text-anchor="middle" font-weight="500" fill="#2563eb" font-size="10">Model: gemini-embedding-001 (task_type=retrieval_document)</text>
    </g>

    <path d="M 220 790 L 220 830" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

    <g id="chromadb-target" filter="url(#shadow)">
        <rect x="50" y="830" width="340" height="85" rx="10" fill="#fffbeb" stroke="#fef08a" stroke-width="2"/>
        <text x="220" y="855" text-anchor="middle" font-weight="800" fill="#854d0e" font-size="14">Vector Database (ChromaDB)</text>
        <text x="220" y="878" text-anchor="middle" font-weight="700" fill="#a16207" font-size="12">Koleksi: unsrat_rag_config_b</text>
        <text x="220" y="895" text-anchor="middle" font-weight="500" fill="#ca8a04" font-size="11">Menyimpan representasi vektor &amp; metadata teks</text>
    </g>

    <g id="config-c-index" filter="url(#shadow)">
        <rect x="490" y="720" width="340" height="70" rx="8" fill="#fff7ed" stroke="#ffedd5" stroke-width="1.5"/>
        <text x="660" y="745" text-anchor="middle" font-weight="800" fill="#c2410c" font-size="13">Sparse RAG (Config C)</text>
        <text x="660" y="763" text-anchor="middle" font-weight="700" fill="#9a3412" font-size="12">Proses Pengindeksan BM25</text>
        <text x="660" y="778" text-anchor="middle" font-weight="500" fill="#ea580c" font-size="10">Perhitungan frekuensi term leksikal (BM25Okapi)</text>
    </g>

    <path d="M 660 790 L 660 830" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-orange)"/>

    <g id="bm25-target" filter="url(#shadow)">
        <rect x="490" y="830" width="340" height="85" rx="10" fill="#fffbeb" stroke="#fef08a" stroke-width="2"/>
        <text x="660" y="855" text-anchor="middle" font-weight="800" fill="#854d0e" font-size="14">Penyimpanan Indeks Leksikal</text>
        <text x="660" y="878" text-anchor="middle" font-weight="700" fill="#a16207" font-size="12">File: bm25_index.pkl</text>
        <text x="660" y="895" text-anchor="middle" font-weight="500" fill="#ca8a04" font-size="11">Format file serial (.pkl)</text>
    </g>

   
</svg>
