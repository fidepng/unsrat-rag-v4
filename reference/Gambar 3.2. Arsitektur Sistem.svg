<svg viewBox="0 0 1100 880" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="background-color: #ffffff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.05" flood-color="#0f172a" />
        </filter>

        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
        </marker>

        <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" />
        </marker>
        
        <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6" />
        </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <line x1="360" y1="20" x2="360" y2="860" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,6" />
    <rect x="70" y="25" width="220" height="30" rx="15" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="180" y="45" text-anchor="middle" font-weight="700" fill="#475569" font-size="12" letter-spacing="1">PROSES INGESTION &amp; PENGINDEKSAN</text>
    
    <rect x="520" y="25" width="260" height="30" rx="15" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="650" y="45" text-anchor="middle" font-weight="700" fill="#475569" font-size="12" letter-spacing="1">PROSES RUNTIME (PER PERMINTAAN)</text>

    <g id="frontend" filter="url(#shadow)">
        <rect x="450" y="80" width="340" height="110" rx="12" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="2"/>
        <text x="620" y="105" text-anchor="middle" font-weight="800" fill="#be185d" font-size="15">Lapisan 5: Frontend (Embedded Widget)</text>
        <text x="620" y="120" text-anchor="middle" font-weight="500" fill="#db2777" font-size="12">index.html + chat-widget.js</text>
        
        <rect x="470" y="135" width="135" height="40" rx="6" fill="#ffffff" stroke="#f472b6" stroke-width="1.5"/>
        <text x="537.5" y="160" text-anchor="middle" font-weight="600" fill="#9d174d" font-size="13">Chatbot Widget</text>
        
        <rect x="635" y="135" width="135" height="40" rx="6" fill="#ffffff" stroke="#f472b6" stroke-width="1.5"/>
        <text x="702.5" y="160" text-anchor="middle" font-weight="600" fill="#9d174d" font-size="13">Panel Rujukan</text>
    </g>

    <g id="backend" filter="url(#shadow)">
        <rect x="450" y="260" width="340" height="110" rx="12" fill="#fff7ed" stroke="#ffedd5" stroke-width="2"/>
        <text x="620" y="285" text-anchor="middle" font-weight="800" fill="#c2410c" font-size="15">Lapisan 4: Backend</text>
        <text x="620" y="300" text-anchor="middle" font-weight="500" fill="#ea580c" font-size="12">FastAPI (app.py)</text>
        
        <rect x="470" y="315" width="135" height="40" rx="6" fill="#ffffff" stroke="#fb923c" stroke-width="1.5"/>
        <text x="537.5" y="340" text-anchor="middle" font-weight="700" fill="#9a3412" font-size="13">/api/chat</text>
        
        <rect x="635" y="315" width="135" height="40" rx="6" fill="#ffffff" stroke="#fb923c" stroke-width="1.5"/>
        <text x="702.5" y="340" text-anchor="middle" font-weight="700" fill="#9a3412" font-size="13">/api/config</text>
    </g>

    <g id="chain" filter="url(#shadow)">
        <rect x="450" y="440" width="340" height="410" rx="12" fill="#ecfdf5" stroke="#d1fae5" stroke-width="2"/>
        <text x="620" y="465" text-anchor="middle" font-weight="800" fill="#047857" font-size="15">Lapisan 3: Chain Pipeline</text>
        <text x="620" y="480" text-anchor="middle" font-weight="500" fill="#059669" font-size="12">Retrieval &amp; Generation (chain.py)</text>
        
        <rect x="490" y="500" width="260" height="40" rx="6" fill="#ffffff" stroke="#34d399" stroke-width="1.5"/>
        <text x="620" y="525" text-anchor="middle" font-weight="600" fill="#065f46" font-size="13">Query Pengguna</text>
        
        <rect x="490" y="560" width="260" height="40" rx="6" fill="#ffffff" stroke="#34d399" stroke-width="1.5"/>
        <text x="620" y="585" text-anchor="middle" font-weight="600" fill="#065f46" font-size="13">Dense / Sparse Retrieval</text>
        
        <rect x="490" y="620" width="260" height="40" rx="6" fill="#ffffff" stroke="#34d399" stroke-width="1.5"/>
        <text x="620" y="645" text-anchor="middle" font-weight="600" fill="#065f46" font-size="13">Threshold Filter</text>
        
        <rect x="490" y="680" width="260" height="40" rx="6" fill="#ffffff" stroke="#34d399" stroke-width="1.5"/>
        <text x="620" y="705" text-anchor="middle" font-weight="600" fill="#065f46" font-size="13">LLM Gemini</text>
        
        <rect x="490" y="740" width="260" height="40" rx="6" fill="#ffffff" stroke="#34d399" stroke-width="1.5"/>
        <text x="620" y="765" text-anchor="middle" font-weight="600" fill="#065f46" font-size="13">Citation Parser</text>
        
        <rect x="490" y="800" width="260" height="40" rx="6" fill="#ffffff" stroke="#34d399" stroke-width="1.5"/>
        <text x="620" y="818" text-anchor="middle" font-weight="700" fill="#065f46" font-size="13">SSE Response</text>
        <text x="620" y="832" text-anchor="middle" font-weight="500" fill="#10b981" font-size="10">(thinking, token, citations, done)</text>
    </g>

    <g id="eval" filter="url(#shadow)">
        <rect x="830" y="260" width="240" height="180" rx="12" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="2"/>
        <text x="950" y="285" text-anchor="middle" font-weight="800" fill="#0f766e" font-size="15">Modul Evaluasi</text>
        <text x="950" y="300" text-anchor="middle" font-weight="500" fill="#0d9488" font-size="12">Framework Pengujian</text>
        
        <rect x="850" y="315" width="200" height="40" rx="6" fill="#ffffff" stroke="#2dd4bf" stroke-width="1.5"/>
        <text x="950" y="340" text-anchor="middle" font-weight="600" fill="#115e59" font-size="13">evaluation.py</text>
        
        <rect x="850" y="380" width="200" height="40" rx="6" fill="#ffffff" stroke="#2dd4bf" stroke-width="1.5"/>
        <text x="950" y="405" text-anchor="middle" font-weight="600" fill="#115e59" font-size="13">Ragas</text>
    </g>

    <g id="corpus" filter="url(#shadow)">
        <rect x="40" y="80" width="280" height="110" rx="12" fill="#f3e8ff" stroke="#e9d5ff" stroke-width="2"/>
        <text x="180" y="105" text-anchor="middle" font-weight="800" fill="#6b21a8" font-size="15">Lapisan 1: Korpus</text>
        <text x="180" y="120" text-anchor="middle" font-weight="500" fill="#7e22ce" font-size="12">Dokumen Mentah Akademik</text>
        
        <rect x="60" y="135" width="240" height="40" rx="6" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/>
        <text x="180" y="160" text-anchor="middle" font-weight="600" fill="#581c87" font-size="13">.md + YAML frontmatter</text>
    </g>

    <g id="ingestion" filter="url(#shadow)">
        <rect x="40" y="240" width="280" height="170" rx="12" fill="#eff6ff" stroke="#dbeafe" stroke-width="2"/>
        <text x="180" y="265" text-anchor="middle" font-weight="800" fill="#1d4ed8" font-size="15">Lapisan 2: Ingestion Pipeline</text>
        <text x="180" y="280" text-anchor="middle" font-weight="500" fill="#2563eb" font-size="12">ingestion.py</text>
        
        <rect x="60" y="300" width="240" height="40" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
        <text x="180" y="325" text-anchor="middle" font-weight="600" fill="#1e3a8a" font-size="13">Two-Stage Splitter</text>
        
        <rect x="60" y="355" width="240" height="40" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
        <text x="180" y="380" text-anchor="middle" font-weight="600" fill="#1e3a8a" font-size="13">Model Embedding</text>
    </g>

    <g id="dbs" filter="url(#shadow)">
        <rect x="40" y="460" width="280" height="180" rx="12" fill="#fefce8" stroke="#fef08a" stroke-width="2"/>
        <text x="180" y="485" text-anchor="middle" font-weight="800" fill="#a16207" font-size="15">Penyimpanan Vector &amp; Index</text>
        <text x="180" y="500" text-anchor="middle" font-weight="500" fill="#ca8a04" font-size="12">Penyimpanan Terindeks</text>
        
        <rect x="60" y="520" width="240" height="45" rx="6" fill="#ffffff" stroke="#facc15" stroke-width="1.5"/>
        <text x="180" y="538" text-anchor="middle" font-weight="700" fill="#854d0e" font-size="13">Vector Database (ChromaDB)</text>
        <text x="180" y="555" text-anchor="middle" font-weight="500" fill="#a16207" font-size="11">Koleksi: unsrat_rag_config_b</text>

        <rect x="60" y="580" width="240" height="45" rx="6" fill="#ffffff" stroke="#facc15" stroke-width="1.5"/>
        <text x="180" y="598" text-anchor="middle" font-weight="700" fill="#854d0e" font-size="13">Penyimpanan Indeks Leksikal</text>
        <text x="180" y="615" text-anchor="middle" font-weight="500" fill="#a16207" font-size="11">File: bm25_index.pkl</text>
    </g>


    <path d="M 620 540 L 620 550" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 620 600 L 620 610" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 620 660 L 620 670" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 620 720 L 620 730" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 620 780 L 620 790" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <path d="M 180 175 L 180 230" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 180 340 L 180 345" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 180 395 L 180 450" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <path d="M 950 355 L 950 370" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <path d="M 500 175 L 500 305" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="490" y="245" text-anchor="end" font-weight="600" fill="#64748b" font-size="12">HTTP Request</text>
    
    <path d="M 570 315 L 570 185" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
    <text x="580" y="240" font-weight="700" fill="#059669" font-size="12">SSE Stream</text>
    <text x="580" y="255" font-weight="500" fill="#10b981" font-size="10">(status &amp; tokens)</text>

    <path d="M 702.5 175 L 702.5 305" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <path d="M 770 335 L 840 335" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow-purple)"/>
    <text x="805" y="325" text-anchor="middle" font-weight="600" fill="#7c3aed" font-size="11">Call</text>

    <path d="M 500 355 L 500 490" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="490" y="425" text-anchor="end" font-weight="600" fill="#64748b" font-size="12">Invoke Chain</text>

    <path d="M 570 490 L 570 365" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
    <text x="580" y="420" font-weight="700" fill="#059669" font-size="12">SSE Callback</text>
    <text x="580" y="435" font-weight="500" fill="#10b981" font-size="10">Streaming Data</text>

    <path d="M 300 542.5 C 380 542.5, 380 570, 480 570" fill="none" stroke="#ca8a04" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
    <path d="M 300 602.5 C 380 602.5, 380 590, 480 590" fill="none" stroke="#ca8a04" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
    
    <rect x="365" y="568" width="55" height="24" rx="4" fill="#fefce8" stroke="#fef08a" />
    <text x="392.5" y="584" text-anchor="middle" font-weight="700" fill="#a16207" font-size="10">Retrieve</text>
</svg>
